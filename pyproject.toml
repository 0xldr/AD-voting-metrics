[project]
name = "ad-voting-metrics"
version = "0.1.0"
description = "Track AD voting metrics for Sky governance"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
]
ignore = [
    "E501",  # line too long — too noisy for legacy code, will tighten later
    "E402",  # module level import not at top — main.py has acceptable patterns
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]  # unused imports often appear in test fixtures

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]