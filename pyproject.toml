[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-voting-metrics"
version = "0.1.0"
description = "Track AD voting metrics for Sky governance"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
    "pandas>=2.2,<3",
    "python-dateutil>=2.9,<3",
    "python-dotenv>=1.2,<2",
    "pydantic>=2.0,<3",
    "pyyaml>=6.0,<7",
    "dune-client>=1.10,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "responses>=0.25",
    "mypy>=1.0",
    "pandas-stubs",
    "types-requests",
    "types-python-dateutil",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear,
    "SIM",  # simplifications
    "RET",
    "PTH",
    "PIE",
]
ignore = [
    "E501",  # line too long — too noisy for legacy code, will tighten later
    "E402",  # module level import not at top — main.py has acceptable patterns
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]  # unused imports often appear in test fixtures

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true