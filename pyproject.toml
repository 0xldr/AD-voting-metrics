[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-voting-metrics"
version = "0.1.0"
description = "Track AD voting metrics for Sky governance"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
    "pandas>=2.2,<3",
    "python-dateutil>=2.9,<3",
    "python-dotenv>=1.2,<2",
    "pydantic>=2.0,<3",
    "pyyaml>=6.0,<7",
    "dune-client>=1.10,<2",
    "gspread>=6.0,<7",
    "google-auth>=2.0,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "responses>=0.25",
    "mypy>=1.0",
    "pandas-stubs",
    "types-requests",
    "types-python-dateutil",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ad_voting_metrics = ["py.typed"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 100
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear,
    "SIM",  # simplifications
    "PD",   # pandas-vet
    "D",    # pydocstyle
    "RET",
    "PTH",
    "PIE",
    "C4",   # comprehension simplifications
    "RUF",  # ruff-specific
    "A",    # builtin shadowing
    "ICN",  # import conventions
    "N",    # pep8-naming
    "PERF", # performance
    "PLE",  # pylint errors
    # PL - selective pylint refactor/warning rules
    "PLW2901", # for-loop variable overwritten in body
    "PLR1714", # multi-equality -> in {...}
    "PLR5501", # collapsible elif
]
ignore = [
    "E501",  # line too long — too noisy for legacy code, will tighten later
    "E402",  # module level import not at top — main.py has acceptable patterns
    # D-rule deferrals — these will be addressed in subsequent commits when
    # docstrings get a focused content/verbosity pass. Each removal here
    # corresponds to a planned docstring-quality commit.
    "D100",  # undocumented-public-module
    "D103",  # undocumented-public-function
    "D104",  # undocumented-public-package
    "D105",  # undocumented-magic-method
    "D205",  # blank line required between summary line and description
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "F401", # unused imports often appear in test fixtures
    "N806", # camelCase locals (mostly mirroring API field names in fixtures)
    "D103", # don't need docstring for all tests
    ]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that hit live external services (Google Sheets, etc.). Skipped by default; run with `pytest -m integration`.",
]
addopts = "-m 'not integration'"

[tool.mypy]
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
check_untyped_defs = true