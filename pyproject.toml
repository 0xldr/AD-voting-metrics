[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-voting-metrics"
version = "0.1.0"
description = "Track AD voting metrics for Sky governance"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.34.2,<3",
    "pandas>=3.0.5,<4",
    "python-dotenv>=1.2,<2",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.15.0,<3",
    "pyyaml>=6.0,<7",
    "gspread>=6.0,<7",
    "gspread-dataframe>=4.0,<5",
    "google-auth>=2.56.3,<3",
    "web3>=7,<8",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest>=9.1.1",
    "responses>=0.26.2",
    "mypy>=2.3.0",
    "pandas-stubs",
    "types-PyYAML",
    "pre-commit>=4.6.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ad_voting_metrics = ["py.typed"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 120
indent-width = 4
target-version = "py311"
preview = true

[tool.ruff.lint]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Everything on, including new linters as ruff adds them; deliberate
# exclusions live in `ignore` below.
select = ["ALL"]
# Individual rules are named rather than coded; only whole-linter and
# multi-rule prefixes (which have no name form) stay as codes.
ignore = [
    # Whole linters and rule groups.
    "CPY", # Flake8-copyright - would require a copyright notice atop every file
    "DJ",  # Flake8-django - Django-specific conventions
    "ERA", # Eradicate - detects commented-out code (false-positives on prose comments)
    "EXE", # Flake8-executable - executable file checks
    "T20", # Flake8-print - disallows print statements
    "D1",  # Pydocstyle - missing docstring in public module, class, or function

    # Individual rules.
    "docstring-missing-returns", # ruff can't scope this to public functions only, so it's off
                                 # globally. Convention: public functions document Returns;
                                 # private helpers may use a one-line docstring.
    "boolean-positional-value-in-call",
    "incorrect-blank-line-before-class",
    "multi-line-summary-first-line",
    "suspicious-non-cryptographic-random-usage",
    "future-required-type-annotation", # would require `from __future__ import annotations`
                                       # in every module using a PEP 604 union
    "raise-vanilla-args", # long exception messages need not live on the exception class
    "raw-string-in-exception",
    "typing-only-third-party-import",
    "typing-only-standard-library-import",
    "missing-trailing-comma", # conflicts with ruff format
    "noqa-comments",          # `# noqa` is portable across linters; `ruff: ignore` is
                              # ruff-only and still preview. Revisit once it stabilizes.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D",   # docstrings not required on tests
    "ANN", # annotations not required on tests
    "DOC", # docstring sections (returns/yields) not required on test helpers

    "assert",                      # bare `assert` is how tests assert
    "hardcoded-password-string",
    "hardcoded-password-func-arg",
    "hardcoded-password-default",
    "magic-value-comparison",
    "private-member-access",
    "unused-function-argument",
    "import-outside-top-level",
    "f-string-in-exception",
    "float-equality-comparison",   # float equality fine in tests; values are exact, not approximations
    "hardcoded-temp-file",         # /tmp paths in tests are not a real risk
    "import-private-name",         # tests legitimately exercise private helpers
    "compare-to-empty-string",     # `== ""` is clearer than implicit-falsiness in assertions
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that hit live external services (Google Sheets, etc.). Skipped by default; run with `pytest -m integration`.",
]
addopts = "-m 'not integration'"
# Unscoped: pandas raises with stacklevel pointing at the caller, so a
# `:pandas` module filter would never match.
filterwarnings = ["error::FutureWarning"]

[tool.mypy]
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["gspread_dataframe"]
ignore_missing_imports = true