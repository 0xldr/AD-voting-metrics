# Aligned Delegate roster — source of truth for who is or has been an AD.
#
# Every delegate ever in the program has an entry here. Currently-active
# delegates have endDate: null. Exited delegates have endDate set to their
# inclusive last day (e.g., endDate: 2026-04-15 means April 15 was their
# last active day).
#
# When a new delegate is aligned: add an entry with their startDate (the date
# AD compensation begins, not the contract creation date).
# When a delegate exits: set their endDate.
#
# The script verifies this YAML against the vote.sky.money API on each run
# and warns about mismatches (a YAML entry with endDate: null that the API
# doesn't return as currently-aligned probably means the operator forgot to
# set endDate after an exit).
#
# Schema validation is in src/ad_voting_metrics/roster.py.
# Address regex: ^0x[0-9a-f]{40}$ (lowercase only).

