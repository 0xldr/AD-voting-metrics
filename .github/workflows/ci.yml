name: CI

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]

jobs:
    lint-and-test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                python-version: "3.12"
                cache: pip
            
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -e .[test]
                pip install ruff
            
            - name: Lint with ruff
              run: ruff check .

            - name: Type-check with mypy
              run: mypy

            - name: Run tests
              run: pytest --tb=short